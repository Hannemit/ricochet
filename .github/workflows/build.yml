name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game logic
        run: node tests/solver.test.js
      - name: Build
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ricochet.apk
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" ricochet.apk \
            --title "Ricochet 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Download ricochet.apk on your Android phone and open it to install." \
            --latest
