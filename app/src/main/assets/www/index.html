<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Ricochet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i class="r0"></i><i class="r1"></i><i class="r2"></i><i class="r3"></i></span>
      <h1>Ricochet</h1>
    </div>
    <div class="round" id="round"></div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <section class="goal" id="goal">
    <canvas id="goalIcon" width="96" height="96"></canvas>
    <div class="goal-text">
      <div class="label">Target</div>
      <div class="goal-main" id="goalText"></div>
    </div>
    <div class="counter"><div class="num" id="moveCount">0</div><div class="label">moves</div></div>
    <div class="counter"><div class="num" id="bestCount">?</div><div class="label">best</div></div>
  </section>

  <div class="board-wrap" id="boardWrap"><canvas id="board"></canvas></div>

  <section class="panel" id="panel" aria-live="polite"></section>

  <nav class="actions">
    <button id="undoBtn">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span>Undo</span>
    </button>
    <button id="resetBtn">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span>Reset</span>
    </button>
    <button id="hintBtn">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
      <span>Hint</span>
    </button>
    <button id="solutionBtn">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Solution</span>
    </button>
    <button id="nextBtn">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span id="nextLabel">Skip</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
</div>

<script src="js/board.js"></script>
<script src="js/solver.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
